<style>
  :root{
    --bg:#F7F6F3;
    --surface:#F1EEE8;
    --card:#FFFFFF;
    --ink:#2B2D42;
    --ink-soft:#9A968C;
    --line:#EAE7E0;
    --accent:#2B2D42;
    --accent-deep:#1C1D2C;
    --income:#12A594;
    --income-bg:#E3F5F2;
    --expense:#E5484D;
    --expense-bg:#FCE8E9;
    --savings:#F5A623;
    --savings-bg:#FDF2DE;
    --positive:#12A594;
    --positive-bg:#E3F5F2;
    --negative:#E5484D;
    --negative-bg:#FCE8E9;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);}

  /* ---------- Header ---------- */
  .app-header{
    position:relative;overflow:hidden;
    margin:14px 14px 0;padding:18px 18px 16px;
    background:linear-gradient(160deg,#FFFFFF 0%,#FBF9F6 100%);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:1px solid var(--line);border-radius:24px;
    box-shadow:0 1px 2px rgba(43,45,66,0.04), 0 16px 30px rgba(43,45,66,0.08);
  }
  .header-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;}
  .header-title{display:flex;flex-direction:column;gap:2px;}
  .app-name{font-size:14.5px;font-weight:700;color:var(--ink);}
  .app-month{font-size:11.5px;color:var(--ink-soft);text-transform:capitalize;}
  .month-btn{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);cursor:pointer;padding:0;
  }
  .month-btn:active{background:var(--line);}
  .month-btn svg{width:17px;height:17px;}

  .flow-row{position:relative;z-index:1;display:flex;gap:16px;margin-top:18px;}
  .flow-item{flex:1;display:flex;flex-direction:column;gap:3px;}
  .flow-label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .flow-value{font-size:21px;font-weight:700;letter-spacing:-0.3px;font-variant-numeric:tabular-nums;}
  .flow-value.income{color:var(--income);}
  .flow-value.expense{color:var(--expense);}
  .quick-add-btn{
    flex:0 0 auto;align-self:center;
    width:38px;height:38px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;
    font-size:22px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0 0 2px;
  }
  .quick-add-btn:active{opacity:0.85;}

  .modal-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(23,25,35,0.45);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-overlay.hidden{display:none;}
  .modal-sheet{
    width:100%;max-width:560px;
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--card);
    border-radius:24px 24px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-sizing:border-box;
  }
  .modal-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px;}
  .modal-type-toggle{
    display:flex;gap:6px;background:var(--surface);
    padding:4px;border-radius:999px;margin-bottom:16px;
  }
  .modal-type-btn{
    flex:1;padding:9px;border-radius:999px;border:none;
    background:none;font-weight:600;font-size:13px;
    color:var(--ink-soft);cursor:pointer;font-family:inherit;
  }
  .modal-type-btn.expense.active{background:var(--expense);color:#fff;}
  .modal-type-btn.income.active{background:var(--income);color:#fff;}
  .modal-field{margin-bottom:12px;}
  .modal-field label{
    display:block;font-size:11.5px;color:var(--ink-soft);
    margin-bottom:4px;font-weight:600;
  }
  .modal-field input, .modal-field select{
    width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:16px;background:var(--card);
    color:var(--ink);font-family:inherit;
  }
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions button{
    flex:1;padding:11px;border-radius:10px;
    font-size:13.5px;font-weight:700;cursor:pointer;border:none;
    font-family:inherit;
  }
  .modal-cancel{background:var(--surface);color:var(--ink-soft);}
  .modal-submit{background:var(--accent);color:#fff;}

  .balance-card{
    position:relative;z-index:1;overflow:hidden;
    margin-top:16px;padding:14px 16px;border-radius:18px;
    background:var(--accent-deep);
    display:flex;align-items:center;color:#fff;
  }
  .balance-item{flex:1;display:flex;flex-direction:column;gap:2px;}
  .balance-item span{
    font-size:10px;color:rgba(255,255,255,0.62);
    text-transform:uppercase;letter-spacing:0.3px;font-weight:600;
  }
  .balance-item strong{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.2px;}
  .balance-item.savings strong{color:var(--savings);}
  .balance-div{width:1px;align-self:stretch;background:rgba(255,255,255,0.16);margin:0 14px;}

<script>
(function(){
  var PIN_CODE = "2293";
  var LOCK_KEY = "familyBudgetUnlocked";
  var lockScreen = document.getElementById("lockScreen");
  var appRoot = document.getElementById("appRoot");
  var input = document.getElementById("lockInput");
  var errorEl = document.getElementById("lockError");

  var unlocked = false;
  try{ unlocked = window.localStorage.getItem(LOCK_KEY) === "1"; }catch(e){}

  if (unlocked){
    lockScreen.classList.add("hidden");
    appRoot.classList.remove("locked");
  } else {
    input.focus();
  }

  function tryUnlock(){
    if (input.value === PIN_CODE){
      try{ window.localStorage.setItem(LOCK_KEY, "1"); }catch(e){}
      lockScreen.classList.add("hidden");
      appRoot.classList.remove("locked");
    } else {
      input.classList.add("error");
      errorEl.textContent = "Неверный код, попробуйте ещё раз";
      input.value = "";
      setTimeout(function(){ input.classList.remove("error"); }, 900);
    }
  }

  document.getElementById("lockBtn").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") tryUnlock();
  });
  input.addEventListener("input", function(){
    input.value = input.value.replace(/\D/g, "").slice(0, 4);
    errorEl.textContent = "";
    if (input.value.length === 4) tryUnlock();
  });
})();
</script>

    list.forEach(function(it){ b += num(it.balance); });
    return b;
  }
  function totalExpenses(dataObj){
    dataObj = dataObj || state.data;
    var plan=0, fact=0;
    Object.keys(dataObj.expenses).forEach(function(cat){
      var s = sumList(dataObj.expenses[cat]);
      plan += s.plan; fact += s.fact;
    });
    return {plan:plan, fact:fact};
  }
  /* ---------- rendering ---------- */
  function renderMonthTabs(){
    var wrap = document.getElementById("monthTabs");
    wrap.innerHTML = "";
    state.meta.months.forEach(function(key){
      var btn = document.createElement("div");
      btn.className = "month-tab" + (key === state.month ? " active" : "");
      btn.dataset.month = key;
      var label = document.createElement("span");
      label.textContent = monthLabel(key);
      btn.appendChild(label);
      if (state.meta.months.length > 1){
        var del = document.createElement("button");
        del.className = "del-month";
        del.textContent = "×";
        del.dataset.action = "delete-month";
        del.dataset.month = key;
        btn.appendChild(del);
      }
      wrap.appendChild(btn);
    });
    document.getElementById("monthLabel").textContent = monthLabel(state.month);
  }

  function renderHeaderStats(){
    var incFact = sumList(state.data.income).fact;
    var expFact = totalExpenses().fact;
    var savFact = sumList(state.data.savings).fact;
    var net = incFact - expFact;
    var leftover = net - savFact;

    document.getElementById("statIncome").textContent = fmt(incFact);
    document.getElementById("statExpense").textContent = fmt(expFact);
    document.getElementById("netValue").textContent = fmtSigned(net);
    document.getElementById("mainBalance").textContent = fmtSigned(leftover);

  function rowHTML(it, kind){
    var isExpense = kind === "expense";
    var over = isExpense && num(it.fact) > num(it.plan);

      + '<input type="number" step="0.01" inputmode="decimal" data-field="fact" data-id="'+it.id+'" value="'+it.fact+'">'

  function renderSummary(){
    var inc = sumList(state.data.income);
    var exp = totalExpenses();
    var sav = sumList(state.data.savings);

    var html = '<div class="card">'
      + '<div class="card-head"><h3>Расходы по категориям</h3><div class="totals"><span>план / факт</span></div></div>';
    Object.keys(state.data.expenses).forEach(function(cat){
      var s = sumList(state.data.expenses[cat]);

      + '<div class="card-head"><h3>Сбережения</h3></div>'

    return html;

  function monthsForYear(year){
    return state.meta.months.filter(function(k){ return k.split("-")[0] === year; }).sort();
  }
  function monthsForQuarter(year, q){
    var startMonth = (q - 1) * 3 + 1, endMonth = q * 3;
    return state.meta.months.filter(function(k){
      var parts = k.split("-");
      var y = parts[0], m = parseInt(parts[1], 10);
      return y === year && m >= startMonth && m <= endMonth;
    }).sort();
  }
  function computePeriodStats(monthKeys){
    var totalIncome = 0, totalExpense = 0, totalSavings = 0;
    var best = null, worst = null;
    monthKeys.forEach(function(key){
      var d = remote.months[key];
      if (!d) return;
      var inc = sumList(d.income).fact;
      var exp = totalExpenses(d).fact;
      var sav = sumList(d.savings).fact;
      var leftover = inc - exp - sav;
      totalIncome += inc; totalExpense += exp; totalSavings += sav;
      if (!best || leftover > best.leftover) best = {key:key, leftover:leftover};
      if (!worst || leftover < worst.leftover) worst = {key:key, leftover:leftover};
    });
    var count = monthKeys.length || 1;
    return {
      totalIncome: totalIncome, totalExpense: totalExpense, totalSavings: totalSavings,
      avgIncome: totalIncome / count, avgExpense: totalExpense / count,
      totalLeftover: totalIncome - totalExpense - totalSavings,
      best: best, worst: worst, count: monthKeys.length
    };
  }

  function renderStatsPanel(){
    var years = Array.from(new Set(state.meta.months.map(function(k){ return k.split("-")[0]; }))).sort();
    if (!state.statsYear || years.indexOf(state.statsYear) === -1) state.statsYear = state.month.split("-")[0];
    if (!state.statsPeriod) state.statsPeriod = "year";
    if (!state.statsQuarter) state.statsQuarter = Math.floor((parseInt(state.month.split("-")[1], 10) - 1) / 3) + 1;

    var monthKeys = state.statsPeriod === "year"
      ? monthsForYear(state.statsYear)
      : monthsForQuarter(state.statsYear, state.statsQuarter);
    var s = computePeriodStats(monthKeys);
    var periodLabel = state.statsPeriod === "year" ? "год" : "квартал";

    var html = '<div class="period-toggle">'
      + '<button class="period-btn' + (state.statsPeriod === "year" ? " active" : "") + '" data-action="stats-period" data-period="year">Год</button>'
      + '<button class="period-btn' + (state.statsPeriod === "quarter" ? " active" : "") + '" data-action="stats-period" data-period="quarter">Квартал</button>'
      + '</div>';

    if (years.length > 1){
      html += '<div class="year-pills">' + years.map(function(y){
        return '<button class="year-pill' + (y === state.statsYear ? " active" : "") + '" data-action="stats-year" data-year="' + y + '">' + y + '</button>';
      }).join("") + '</div>';
    }
    if (state.statsPeriod === "quarter"){
      html += '<div class="year-pills">' + [1,2,3,4].map(function(q){
        return '<button class="year-pill' + (q === state.statsQuarter ? " active" : "") + '" data-action="stats-quarter" data-q="' + q + '">Q' + q + '</button>';
      }).join("") + '</div>';
    }

    html += '<div class="metric-grid">'
      + '<div class="metric"><div class="lbl">Доходы за ' + periodLabel + '</div><div class="val">' + fmt(s.totalIncome) + '</div></div>'
      + '<div class="metric"><div class="lbl">Расходы за ' + periodLabel + '</div><div class="val">' + fmt(s.totalExpense) + '</div></div>'
      + '<div class="metric"><div class="lbl">Средние доходы/мес</div><div class="val">' + fmt(s.avgIncome) + '</div></div>'
      + '<div class="metric"><div class="lbl">Средние расходы/мес</div><div class="val">' + fmt(s.avgExpense) + '</div></div>'
      + '</div>';

    html += '<div class="card"><div class="card-head"><h3>Итог за ' + periodLabel + '</h3></div>'
      + '<div class="breakdown-row"><span class="name">Остаток после сбережений</span><span class="nums" style="font-weight:700;color:' + (s.totalLeftover >= 0 ? "var(--positive)" : "var(--negative)") + ';">' + fmtSigned(s.totalLeftover) + '</span></div>'
      + '<div class="breakdown-row"><span class="name">Отложено в сбережения</span><span class="nums">' + fmt(s.totalSavings) + '</span></div>'
      + '<div class="breakdown-row"><span class="name">Месяцев с данными</span><span class="nums">' + s.count + '</span></div>'
      + '</div>';

    if (s.best){
      html += '<div class="card"><div class="card-head"><h3>Лучший месяц</h3></div>'
        + '<div class="breakdown-row"><span class="name">' + monthLabel(s.best.key) + '</span><span class="nums" style="font-weight:700;color:var(--positive);">' + fmtSigned(s.best.leftover) + '</span></div>'
        + '</div>';
    }
    if (s.worst && (!s.best || s.worst.key !== s.best.key)){
      html += '<div class="card"><div class="card-head"><h3>Худший месяц</h3></div>'
        + '<div class="breakdown-row"><span class="name">' + monthLabel(s.worst.key) + '</span><span class="nums" style="font-weight:700;color:var(--negative);">' + fmtSigned(s.worst.leftover) + '</span></div>'
        + '</div>';
    }
    if (!monthKeys.length){
      html += '<div class="empty">Нет данных за этот период</div>';
    }

    return html;
  }

  function render(){
    renderMonthTabs();
    renderHeaderStats();
    document.querySelectorAll("#sectionTabs button").forEach(function(b){
      b.classList.toggle("active", b.dataset.tab === state.tab);
    });
    var content = document.getElementById("content");
    if (state.tab === "summary") content.innerHTML = renderSummary();
    else if (state.tab === "income") content.innerHTML = renderIncome();
    else if (state.tab === "expenses") content.innerHTML = renderExpenses();
    else if (state.tab === "savings") content.innerHTML = renderSavings();
  }

  /* ---------- mutation helpers ---------- */
  function findItem(list, id){
    for (var i=0;i<list.length;i++){ if (list[i].id === id) return list[i]; }
    return null;
  }
  function removeItem(list, id){
    var idx = -1;
    for (var i=0;i<list.length;i++){ if (list[i].id === id){ idx=i; break; } }
    if (idx > -1) list.splice(idx,1);
  }

  /* ---------- events ---------- */
  document.getElementById("sectionTabs").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    state.tab = btn.dataset.tab;
    render();
  });

  var armedDeleteMonth = null;
  var armedDeleteTimer = null;

  document.getElementById("monthMenuBtn").addEventListener("click", function(){
    var panel = document.getElementById("monthPanel");
    panel.style.display = (panel.style.display === "none") ? "block" : "none";
  });

  document.getElementById("monthTabs").addEventListener("click", async function(e){
    var delBtn = e.target.closest('[data-action="delete-month"]');
    if (delBtn){
      e.stopPropagation();
      var key = delBtn.dataset.month;
      if (armedDeleteMonth !== key){
        armedDeleteMonth = key;
        clearTimeout(armedDeleteTimer);
        armedDeleteTimer = setTimeout(function(){ armedDeleteMonth = null; render(); }, 3000);
        delBtn.textContent = "удалить?";
        delBtn.classList.add("armed");
        return;
      }
      clearTimeout(armedDeleteTimer);
      armedDeleteMonth = null;
      var idx = state.meta.months.indexOf(key);
      if (idx > -1) state.meta.months.splice(idx,1);
      if (state.meta.current === key) state.meta.current = state.meta.months[0];
      await saveMeta();
      state.month = state.meta.current;
      state.data = await loadMonth(state.month);
      showToast("Месяц удалён");
      render();
      return;
    }
    var tab = e.target.closest(".month-tab");
    if (!tab) return;
    var key = tab.dataset.month;
    if (key === state.month) return;
    state.month = key;
    state.meta.current = key;
    await saveMeta();
    state.data = await loadMonth(key);
    render();
  });

  document.getElementById("addMonthBtn").addEventListener("click", function(){
    var panel = document.getElementById("addMonthPanel");
    var open = panel.style.display !== "none";
    if (open){
      panel.style.display = "none";
    } else {
      document.getElementById("newMonthInput").value = currentMonthKey();
      panel.style.display = "flex";
      document.getElementById("newMonthInput").focus();
    }
  });

  document.getElementById("newMonthCancel").addEventListener("click", function(){
    document.getElementById("addMonthPanel").style.display = "none";
  });

  async function getPrevMonthData(beforeKey){
    var earlier = state.meta.months.filter(function(k){ return k < beforeKey; }).sort();
    if (!earlier.length) return null;
    var prevKey = earlier[earlier.length - 1];
    if (prevKey === state.month) return state.data;
    try{ return await loadMonth(prevKey); }
    catch(e){ return null; }
  }

  document.getElementById("newMonthConfirm").addEventListener("click", async function(){
    var val = document.getElementById("newMonthInput").value;
    var m = val && val.match(/^(\d{4})-(\d{2})$/);
    if (!m){ showToast("Выберите месяц"); return; }
    var key = m[1] + "-" + m[2];
    if (state.meta.months.indexOf(key) !== -1){
      showToast(monthLabel(key) + " уже добавлен");
      return;
    }
    var isNew = true;
    var prevData = await getPrevMonthData(key);
    state.meta.months.push(key);
    state.meta.months.sort();
    state.meta.current = key;
    await saveMeta();
    state.month = key;
    state.data = await loadMonth(key);
    if (isNew && prevData){
      var incSum = sumList(prevData.income);
      var expSum = totalExpenses(prevData);
      var savSum = sumList(prevData.savings);
      var leftover = incSum.fact - expSum.fact - savSum.fact;

      var newIncome = carryOverList(prevData.income);
      newIncome.push({id:uid(), name:"Остаток с прошлого месяца", plan:leftover, fact:leftover});

      state.data = {
        income: newIncome,
        expenses: carryOverExpenses(prevData.expenses),
        savings: carryOverSavings(prevData.savings)
      };
      scheduleSaveMonth();
    }
    document.getElementById("addMonthPanel").style.display = "none";
    render();
  });

  document.getElementById("content").addEventListener("input", function(e){
    var el = e.target;
    var id = el.dataset.id;
    var field = el.dataset.field;
    if (!id || !field) return;

    var lists = [
      {list: state.data.income, kind: "income"},
      {list: state.data.savings, kind: "savings"}
    ];
    Object.keys(state.data.expenses).forEach(function(cat){
      lists.push({list: state.data.expenses[cat], kind: "expense"});
    });

    var item = null, itemKind = null;
    for (var i=0;i<lists.length;i++){
      item = findItem(lists[i].list, id);
      if (item){ itemKind = lists[i].kind; break; }
    }
    if (!item) return;

    if (field === "name") item.name = el.value;
    else {
      var newVal = el.value === "" ? 0 : num(el.value);
      if (field === "fact" && Object.prototype.hasOwnProperty.call(item, "balance")){
        var delta = newVal - num(item.fact);
        item.balance = num(item.balance) + delta;
        var row2 = el.closest(".row");
        if (row2){
          var balInput = row2.querySelector('input[data-field="balance"]');
          if (balInput) balInput.value = item.balance;
        }
      }
      item[field] = newVal;
    }

    if ((field === "plan" || field === "fact") && itemKind === "expense"){
      var row = el.closest(".row");
      if (row){
        var over = num(item.fact) > num(item.plan);
        row.classList.toggle("over", over);
      }
    }

    // Update header totals + balance without a full re-render (keeps focus)
    renderHeaderStats();
    updateHeadTotals();
    scheduleSaveMonth();
  });

  function updateHeadTotals(){
    document.querySelectorAll(".card").forEach(function(card){
      var head = card.querySelector(".card-head .totals");
      if (!head) return;
      var h3 = card.querySelector(".card-head h3");
      if (!h3) return;
      var title = h3.textContent;
      var list = null;
      var isSavings = title === "Отчисления на сбережения";
      if (title === "Доходы") list = state.data.income;
      else if (isSavings) list = state.data.savings;
      else if (state.data.expenses[title]) list = state.data.expenses[title];
      if (list){
        var t = sumList(list);
        if (isSavings){
          head.innerHTML = '<span>план '+fmt(t.plan)+'</span><span>факт '+fmt(t.fact)+'</span><span>баланс '+fmt(sumBalance(list))+'</span>';
        } else {
          head.innerHTML = '<span>план '+fmt(t.plan)+'</span><span>факт '+fmt(t.fact)+'</span>';
        }
      }
    });
  }

  document.getElementById("content").addEventListener("click", async function(e){
    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;

    if (action === "toggle-stats"){
      state.statsOpen = !state.statsOpen;
      render();
    } else if (action === "stats-period"){
      state.statsPeriod = btn.dataset.period;
      render();
    } else if (action === "stats-year"){
      state.statsYear = btn.dataset.year;
      render();
    } else if (action === "stats-quarter"){
      state.statsQuarter = parseInt(btn.dataset.q, 10);
      render();
    } else if (action === "add-income"){
      state.data.income.push({id:uid(), name:"", plan:0, fact:0});
      scheduleSaveMonth(); render();
    } else if (action === "add-saving"){
      state.data.savings.push({id:uid(), name:"", plan:0, fact:0, balance:0});
      scheduleSaveMonth(); render();
    } else if (action === "add-expense"){
      var cat = btn.dataset.cat;
      if (state.data.expenses[cat]) state.data.expenses[cat].push({id:uid(), name:"", plan:0, fact:0});
      scheduleSaveMonth(); render();
    } else if (action === "add-category"){
      var input = document.getElementById("newCatInput");
      var name = input.value.trim();
      if (!name){ showToast("Введите название категории"); return; }
      if (state.data.expenses[name]){ showToast("Такая категория уже есть"); return; }
      state.data.expenses[name] = [];
      scheduleSaveMonth(); render();
    } else if (action === "delete-item"){
      var id = btn.dataset.id;
      var lists = [state.data.income, state.data.savings];
      Object.keys(state.data.expenses).forEach(function(cat){ lists.push(state.data.expenses[cat]); });
      lists.forEach(function(l){ removeItem(l, id); });
      scheduleSaveMonth(); render();
    }
  });

    if (window.visualViewport){
      overlay.style.height = window.visualViewport.height + "px";
      overlay.style.top = window.visualViewport.offsetTop + "px";
    }
  }
  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", fitModalToViewport);
    window.visualViewport.addEventListener("scroll", fitModalToViewport);
  }

  (function bindQuickFieldFocusScroll(){
    var sheet = document.querySelector("#quickAddOverlay .modal-sheet");
    if (!sheet) return;
    var fields = sheet.querySelectorAll("input, select");
    for (var i = 0; i < fields.length; i++){
      fields[i].addEventListener("focus", function(){
        var el = this;
        [50, 150, 300, 500].forEach(function(delay){
          setTimeout(function(){
            fitModalToViewport();
            el.scrollIntoView({block: "center", behavior: "smooth"});
          }, delay);

  }
  function populateQuickCategories(){
    var sel = document.getElementById("quickCategory");
    var cats = Object.keys(state.data.expenses);
    sel.innerHTML = cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join("");
  }
  function populateQuickNames(){
    var sel = document.getElementById("quickName");
    var names;
    if (quickType === "income"){
      names = state.data.income.map(function(it){ return it.name; }).filter(Boolean);
    } else {
      var cat = document.getElementById("quickCategory").value;
      var list = state.data.expenses[cat] || [];
      names = list.map(function(it){ return it.name; }).filter(Boolean);
    }
    var unique = Array.from(new Set(names));
    var options = unique.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join("");
    options += '<option value="__new__">+ Новая статья</option>';
    sel.innerHTML = options;
    toggleQuickNewField();
  }
  function toggleQuickNewField(){
    var sel = document.getElementById("quickName");
    document.getElementById("quickNameNewField").style.display = sel.value === "__new__" ? "block" : "none";
  }

  document.getElementById("quickAddBtn").addEventListener("click", openQuickAdd);
  document.getElementById("quickCancel").addEventListener("click", closeQuickAdd);
  document.getElementById("quickAddOverlay").addEventListener("click", function(e){
    if (e.target.id === "quickAddOverlay") closeQuickAdd();
  });
  document.getElementById("quickTypeExpense").addEventListener("click", function(){
    quickType = "expense"; updateQuickTypeUI(); populateQuickNames();
  });
  document.getElementById("quickTypeIncome").addEventListener("click", function(){
    quickType = "income"; updateQuickTypeUI(); populateQuickNames();
  });
  document.getElementById("quickCategory").addEventListener("change", populateQuickNames);
  document.getElementById("quickName").addEventListener("change", toggleQuickNewField);
  document.getElementById("quickSubmit").addEventListener("click", function(){
    var amount = num(document.getElementById("quickAmount").value);
    if (amount <= 0){ showToast("Введите сумму"); return; }

    var nameSel = document.getElementById("quickName");
    var isNewName = nameSel.value === "__new__";
    var name = isNewName
      ? document.getElementById("quickNameNew").value.trim()
      : nameSel.value;
    if (!name){ showToast("Введите статью"); return; }

    if (quickType === "income"){
      var incomeItem = null;
      if (!isNewName){
        for (var i=0;i<state.data.income.length;i++){
          if (state.data.income[i].name === name){ incomeItem = state.data.income[i]; break; }
        }
      }
      if (incomeItem){
        incomeItem.fact = num(incomeItem.fact) + amount;
      } else {
        state.data.income.push({id:uid(), name:name, plan:0, fact:amount});
      }
    } else {
      var cats = Object.keys(state.data.expenses);
      if (!cats.length){ showToast("Сначала добавьте категорию расходов"); return; }
      var cat = document.getElementById("quickCategory").value || cats[0];
      var list = state.data.expenses[cat];
      var expenseItem = null;
      if (!isNewName){
        for (var j=0;j<list.length;j++){
          if (list[j].name === name){ expenseItem = list[j]; break; }
        }
      }
      if (expenseItem){
        expenseItem.fact = num(expenseItem.fact) + amount;
      } else {
        list.push({id:uid(), name:name, plan:0, fact:amount});
      }
    }
    scheduleSaveMonth();
    closeQuickAdd();
    render();
    showToast("Добавлено");
  });

  /* ---------- init ---------- */
  async function init(){
    try{
      state.meta = await loadMeta();
      state.month = state.meta.current || state.meta.months[0];
      state.data = await loadMonth(state.month);
      render();
      subscribeRealtime();
    }catch(e){
      document.getElementById("content").innerHTML = '<div class="empty">Не удалось загрузить данные. Обновите страницу.</div>';
    }
  }
  init();
  })();
</script>
</body>
</html>
